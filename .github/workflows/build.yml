name: Build & Release

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write   # Needed to create GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish always: uploads installers + latest.yml to GitHub Release
      # latest.yml is required by electron-updater for auto-update detection
      # GH_TOKEN is used both for publishing AND embedded into the app
      # for private repo auto-update authentication
      - name: Build & Publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish always: uploads .dmg + .zip + latest-mac.yml to GitHub Release
      # .zip is required for macOS auto-update, .dmg is for manual downloads
      # latest-mac.yml is required by electron-updater for auto-update detection
      - name: Build & Publish macOS installer
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
